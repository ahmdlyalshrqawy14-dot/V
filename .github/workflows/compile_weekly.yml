name: Weekly Long-form Compilation

on:
  workflow_dispatch:
  schedule:
    # يعمل تلقائياً كل جمعة الساعة 15:00 UTC
    # بتوقيت مصر: 6:00 مساءً
    - cron:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Compilation Engine
        run: |
          python compiler.py

      - name: Send Compilation to Telegram
        env:
          RAW_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. تنظيف التوكن والآي دي تلقائياً من أي مسافات أو أسطر زائدة
          BOT_TOKEN=$(echo "$RAW_BOT_TOKEN" | grep -o -E '[0-9]+:[a-zA-Z0-9_-]+' | head -n 1)
          CHAT_ID=$(echo "$RAW_CHAT_ID" | grep -o -E '[0-9]+' | head -n 1)

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "[ERROR] Invalid or missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
            exit 1
          fi

          # 2. إرسال قائمة الفصول (Chapters) لوصف يوتيوب بتشفير آمن
          if [ -f "compilation_chapters.txt" ]; then
            CHAPTERS=$(head -c 3500 compilation_chapters.txt)
            MESSAGE=$(printf '📑 فصول الفيديو المجمع (انسخها في وصف يوتيوب):\n\n%s' "$CHAPTERS")
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          fi

          # 3. فحص حجم الفيديو وإرساله عبر تليجرام بأمان
          if [ -f "weekly_compilation.mp4" ]; then
            FILE_SIZE=$(stat -c%s "weekly_compilation.mp4" 2>/dev/null || stat -f%z "weekly_compilation.mp4")

            # حد بوتات تليجرام الأقصى للإرسال هو 50 ميجابايت
            if [ "$FILE_SIZE" -le 50000000 ]; then
              echo "[TELEGRAM] Sending weekly compilation video..."
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
                -F "chat_id=${CHAT_ID}" \
                -F "video=@weekly_compilation.mp4" \
                -F "supports_streaming=true" \
                -F "caption=🎥 الفيديو الأسبوعي المجمع جاهز (16:9 السينمائي)"
              echo "[TELEGRAM] Video delivered ✓"
            else
              echo "[WARN] Video size exceeds Telegram 50MB limit."
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                --data-urlencode "text=⚠️ تم تجهيز الفيديو الأسبوعي بنجاح، لكن حجمه تجاوز 50MB (الحد الأقصى المسموح لبوتات تليجرام). تم حفظه كملف كامل في قسم الـ Artifacts في GitHub لتنزيله بأعلى دقة."
            fi
          fi

      - name: Save Archive State to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Archive compiled videos into archive/compiled/ [skip ci]"
            git pull --rebase
            git push
          else
            echo "No file state changes to commit."
          fi

      - name: Upload Compilation Video Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-compilation-run-${{ github.run_number }}
          path: |
            weekly_compilation.mp4
            compilation_chapters.txt
          if-no-files-found: warn
