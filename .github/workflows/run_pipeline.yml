name: Run Video Pipeline Test

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'اللغة / Language (ar or en)'
        required: true
        default: 'ar'
      series_name:
        description: 'اسم السلسلة / Series Title'
        required: true
        default: 'حيل الرياضيات السريعة'
      lesson_num:
        description: 'رقم الدرس / Episode Number'
        required: true
        default: '1'
      target_duration:
        description: 'المدة المستهدفة بالثواني / Target Duration (seconds)'
        required: true
        default: '35'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core fonts-kacst

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERIES_NAME: ${{ github.event.inputs.series_name }}
          LESSON_NUM: ${{ github.event.inputs.lesson_num }}
          VIDEO_LANG: ${{ github.event.inputs.language }}
          TARGET_DURATION: ${{ github.event.inputs.target_duration }}
        run: |
          python pipeline.py

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: video-lesson-output
          path: |
            final_video.mp4
            thumbnail.jpg
            captions.srt
            بيانات_*.txt
