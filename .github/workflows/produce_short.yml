name: Studio Production Pipeline

on:
  workflow_dispatch:
    inputs:
      series_name:
        description: 'Target Series'
        required: true
        default: 'speed_math'
        type: choice
        options:
          - speed_math
      lesson_num:
        description: 'Manual Lesson Number (Leave empty to auto-progress)'
        required: false
        default: ''
        type: string

  schedule:
    # يعمل مرتين يومياً بتوقيت UTC
    # 5:00 UTC = 8:00 صباحاً بتوقيت مصر (صيفي UTC+3)
    # 11:00 UTC = 2:00 ظهراً بتوقيت مصر (صيفي UTC+3)
    - cron: '0 5,11 * * *'

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Studio Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERIES_NAME: ${{ github.event.inputs.series_name || 'speed_math' }}
          LESSON_NUM: ${{ github.event.inputs.lesson_num || '' }}
        run: |
          python pipeline.py

      - name: Save Progress and Archive Video
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p archive
          META_FILE=$(ls details_lesson_*.txt 2>/dev/null | head -n 1)
          if [ -n "$META_FILE" ]; then
            NUM=$(echo "$META_FILE" | grep -o -E '[0-9]+')
            cp final_video.mp4 "archive/lesson_${NUM}.mp4"
          fi
          git add series/ archive/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-archive lesson and advance index [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Upload Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.series_name || 'speed_math' }}-run-${{ github.run_number }}
          path: |
            final_video.mp4
            thumbnail.jpg
            details_lesson_*.txt
          if-no-files-found: warn
