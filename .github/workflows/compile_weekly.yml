name: Weekly Long-form Compilation

on:
  workflow_dispatch:
  schedule:
    # يعمل تلقائياً كل جمعة الساعة 11:00 مساءً بتوقيت مصر (20:00 UTC)
    - cron: '0 20 * * 5'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Compilation Engine
        run: |
          python compiler.py

      - name: Save Archive State to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Archive compiled videos into archive/compiled/ [skip ci]"
            git pull --rebase
            git push
          else
            echo "No file state changes to commit."
          fi

      - name: Upload Compilation Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-compilation-run-${{ github.run_number }}
          path: |
            weekly_compilation.mp4
            compilation_chapters.txt
          if-no-files-found: warn
