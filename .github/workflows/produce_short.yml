name: Studio Production Pipeline

on:
  workflow_dispatch:
    inputs:
      series_name:
        description: 'Target Series'
        required: true
        default: 'speed_math'
        type: choice
        options:
          - speed_math
      lesson_num:
        description: 'Manual Lesson Number (Leave empty to auto-progress)'
        required: false
        default: ''
        type: string

  schedule:
    # 5:00 UTC = 8:00 صباحاً بتوقيت مصر
    # 11:00 UTC = 2:00 ظهراً بتوقيت مصر
    - cron: 

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Studio Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERIES_NAME: ${{ github.event.inputs.series_name || 'speed_math' }}
          LESSON_NUM: ${{ github.event.inputs.lesson_num || '' }}
        run: |
          python pipeline.py

      - name: Send Video and Metadata to Telegram
        env:
          RAW_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. تنظيف التوكن والآي دي تلقائياً من أي مسافات أو أسطر منسوخة بالخطأ
          BOT_TOKEN=$(echo "$RAW_BOT_TOKEN" | grep -o -E '[0-9]+:[a-zA-Z0-9_-]+' | head -n 1)
          CHAT_ID=$(echo "$RAW_CHAT_ID" | grep -o -E '[0-9]+' | head -n 1)

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "[ERROR] Invalid or missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
            exit 1
          fi

          META_FILE=$(ls details_lesson_*.txt 2>/dev/null | head -n 1)

          # 2. إرسال نص الوصف والعنوان مع تشفير آمن للأسطر والرموز
          if [ -n "$META_FILE" ] && [ -f "$META_FILE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text@${META_FILE}"
          fi

          # 3. إرسال الصورة المصغرة
          if [ -f "thumbnail.jpg" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "photo=@thumbnail.jpg" \
              -F "caption=🖼 الصورة المصغرة جاهزة"
          fi

          # 4. إرسال فيديو الشورتس
          if [ -f "final_video.mp4" ]; then
            echo "[TELEGRAM] Sending final video..."
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
              -F "chat_id=${CHAT_ID}" \
              -F "video=@final_video.mp4" \
              -F "supports_streaming=true" \
              -F "caption=🎬 حلقة جديدة جاهزة للنشر!"
            echo "[TELEGRAM] Delivery complete ✓"
          fi

      - name: Save Progress and Archive Video
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p archive
          META_FILE=$(ls details_lesson_*.txt 2>/dev/null | head -n 1)
          if [ -n "$META_FILE" ]; then
            NUM=$(echo "$META_FILE" | grep -o -E '[0-9]+')
            cp final_video.mp4 "archive/lesson_${NUM}.mp4"
          fi
          git add series/ archive/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-archive lesson and advance index [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state changes to commit."
          fi
